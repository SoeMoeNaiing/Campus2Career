<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Campus2Career</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/navbar-footer.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" /> <!-- This links the CSS above -->
</head>
<body>
  
  <!-- Navbar goes here -->

  <!-- THE AUTH CONTAINER -->
  <main class="auth-page">
    <div class="auth-card">
      
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Sign in to continue to Campus2Career</p>
      </div>

      <!-- THE ROLE SELECTOR BUTTONS -->
      <!-- <div class="role-switch">
        <button type="button" class="role-btn active" id="btnStudent">Student</button>
        <button type="button" class="role-btn" id="btnRecruiter">Recruiter</button>
      </div> -->

      <!-- THE FORM -->
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@university.edu" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one now</a>
      </div>

    </div>
  </main>

</body>
</html>
