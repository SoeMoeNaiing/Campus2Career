<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Internship Details | Campus2Career</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="dashboard-header">

        <div class="dashboard-nav">

            <a href="dashboard.html" class="logo">
                Campus<span>2</span>Career
            </a>

            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="internships.html" class="active">
                    Internships
                </a>

                <a href="applications.html">
                    Applications
                </a>

                <a href="saved.html">
                    Saved
                </a>

                <a href="profile.html">
                    Profile
                </a>

                <button
                    type="button"
                    onclick="logout()"
                    class="logout-btn"
                >
                    Logout
                </button>

            </nav>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="details-container">

        <!-- Back -->

        <a
            href="internships.html"
            class="back-link"
        >
            ← Back to Internships
        </a>


        <!-- Internship Details -->

        <section
            id="internshipDetails"
            class="internship-details"
        >

            <!-- JavaScript will render the internship here -->

        </section>


        <!-- Not Found -->

        <section
            id="internshipNotFound"
            class="details-not-found"
            hidden
        >

            <h1>
                Internship not found
            </h1>

            <p>
                The internship you're looking for doesn't exist
                or is no longer available.
            </p>

            <a
                href="internships.html"
                class="btn btn-primary"
            >
                Browse Internships
            </a>

        </section>

    </main>


    <script src="../../data/seed.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/student/internships.js"></script>

</body>

</html>
