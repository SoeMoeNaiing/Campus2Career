<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Placement Portal | Campus2Career</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/navbar-footer.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand-logo"><img src="../assets/logo1.webp" alt="Logo" /></a>
      <div class="nav-auth" id="navAuthContainer"></div>
    </div>
  </header>

  <main class="section-container">
    <div class="dashboard-header">
      <h2>University Placement Cell Console</h2>
      <p class="text-muted">Manage employer verifications and oversee placement analytics</p>
    </div>

    <div class="metrics-row">
      <div class="metric-card">
        <span class="metric-num" id="adminTotalStudents">0</span>
        <span class="metric-label">Registered Students</span>
      </div>
      <div class="metric-card">
        <span class="metric-num" id="adminTotalCompanies">0</span>
        <span class="metric-label">Partner Companies</span>
      </div>
      <div class="metric-card">
        <span class="metric-num" id="adminPlacementRate">0%</span>
        <span class="metric-label">Placement Rate</span>
      </div>
    </div>

    <!-- Company Approvals Table -->
    <div class="panel-card">
      <h3>Pending Recruiter Verifications</h3>
      <table class="data-table">
        <thead>
          <tr>
            <th>Company Name</th>
            <th>Contact Email</th>
            <th>Industry</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="recruiterApprovalTable">
          <!-- JS dynamic rows -->
        </tbody>
      </table>
    </div>
  </main>
  <script src="js/core/db.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/navbar.js"></script>
<script src="../js/features/jobs.js"></script>
<script src="../js/features/applications.js"></script>
</body>
</html>
