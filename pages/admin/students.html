<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Students | Admin | Campus2Career</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/icons.css">
</head>

<body class="admin-body">

    <div class="admin-layout">

        <!-- ============== SIDEBAR ============== -->
        <aside class="admin-sidebar">

            <div class="admin-sidebar-header">
                <a href="dashboard.html" class="logo">
                    Campus<span>2</span>Career
                </a>
                <span class="role-tag">Admin Console</span>
            </div>


            <nav class="admin-sidebar-nav">

                <div class="admin-nav-group">
                    <p class="admin-nav-label">Overview</p>
                    <a href="dashboard.html" class="admin-nav-item">
                        <span class="nav-icon">▦</span>
                        Dashboard
                    </a>
                </div>


                <div class="admin-nav-group">
                    <p class="admin-nav-label">Management</p>

                    <a href="recruiters.html" class="admin-nav-item">
                        <span class="nav-icon">🏢</span>
                        Recruiters
                        <span
                            id="pendingBadge"
                            class="admin-nav-badge"
                        ></span>
                    </a>

                    <a
                        href="students.html"
                        class="admin-nav-item active"
                    >
                        <span class="nav-icon">🎓</span>
                        Students
                    </a>

                    <a href="internships.html" class="admin-nav-item">
                        <span class="nav-icon">📋</span>
                        Internships
                    </a>

                    <a href="applications.html" class="admin-nav-item">
                        <span class="nav-icon">📨</span>
                        Applications
                    </a>
                </div>

            </nav>


            <div class="admin-sidebar-footer">
                <div class="admin-avatar" id="adminInitial">A</div>
                <div class="admin-user-info">
                    <strong id="adminName">Admin</strong>
                    <span>Administrator</span>
                </div>
                <button
                    type="button"
                    class="admin-logout"
                    onclick="logout()"
                >
                    Logout
                </button>
            </div>

        </aside>


        <!-- ============== MAIN ============== -->
        <main class="admin-main">

            <header class="admin-topbar">
                <div>
                    <h1>Students</h1>
                    <p class="admin-breadcrumb">
                        Browse and manage registered student accounts
                    </p>
                </div>
            </header>


            <section class="admin-content">

                <!-- Search -->
                <div class="admin-search-bar">
                    <input
                        type="text"
                        id="studentSearchInput"
                        placeholder="Search by name, email, or university…"
                    >
                </div>


                <div class="admin-panel">

                    <div class="admin-panel-heading">
                        <div>
                            <h2 id="listHeading">
                                All Students
                            </h2>
                            <p id="listSubheading">
                                Every registered student account
                            </p>
                        </div>
                    </div>


                    <div id="studentList">
                        <!-- Rendered by JS -->
                    </div>


                    <div
                        id="noStudents"
                        class="admin-empty"
                        hidden
                    >
                        No students match your search.
                    </div>

                </div>

            </section>

        </main>

    </div>


    <script src="../../data/seed.js"></script>
    <script src="../../js/icons.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/admin/students.js"></script>

</body>

</html>
