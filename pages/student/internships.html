<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Internships | Campus2Career</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>

<body>

    <header class="dashboard-header">

        <div class="dashboard-nav">

            <a href="dashboard.html" class="logo">
                Campus<span>2</span>Career
            </a>

            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="internships.html" class="active">
                    Internships
                </a>

                <a href="applications.html">
                    Applications
                </a>

                <a href="saved.html">
                    Saved
                </a>

                <a href="profile.html">
                    Profile
                </a>

                <button
                    type="button"
                    onclick="logout()"
                    class="logout-btn"
                >
                    Logout
                </button>

            </nav>

        </div>

    </header>


    <main class="internships-container">

        <!-- ================= PAGE HEADING ================= -->

        <section class="internships-heading">

            <p class="dashboard-label">
                Opportunities
            </p>

            <h1>
                Find Your Internship
            </h1>

            <p>
                Explore internship opportunities and find
                one that matches your skills and interests.
            </p>

        </section>


        <!-- ================= SEARCH & FILTERS ================= -->

        <section class="internship-filters">

            <div class="search-box">

                <label for="searchInput">
                    Search
                </label>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search internships or companies..."
                >

            </div>


            <div class="filter-box">

                <label for="categoryFilter">
                    Category
                </label>

                <select id="categoryFilter">

                    <option value="all">
                        All Categories
                    </option>

                </select>

            </div>


            <div class="filter-box">

                <label for="locationFilter">
                    Location
                </label>

                <select id="locationFilter">

                    <option value="all">
                        All Locations
                    </option>

                </select>

            </div>


            <div class="filter-box">

                <label for="typeFilter">
                    Type
                </label>

                <select id="typeFilter">

                    <option value="all">
                        All Types
                    </option>

                </select>

            </div>

        </section>


        <!-- ================= RESULTS ================= -->

        <section class="internship-results">

            <div class="results-header">

                <h2>
                    Available Internships
                </h2>

                <span id="resultsCount">
                    0 internships
                </span>

            </div>


            <div
                id="internshipList"
                class="internship-grid"
            >
                <!-- JavaScript renders cards here -->
            </div>


            <div
                id="noResults"
                class="empty-state"
                hidden
            >

                <h3>
                    No internships found
                </h3>

                <p>
                    Try changing your search or filters.
                </p>

            </div>

        </section>

    </main>


    <script src="../../data/seed.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/student/internships.js"></script>

</body>

</html>
