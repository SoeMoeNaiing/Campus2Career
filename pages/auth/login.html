<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Campus2Career</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card">

            <a href="../../index.html" class="logo">
                Campus<span>2</span>Career
            </a>

            <div class="auth-heading">

                <h1>Welcome back</h1>

                <p>
                    Login to continue your Campus2Career journey.
                </p>

            </div>


            <form id="loginForm" novalidate>

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                    <small
                        class="form-error"
                        id="emailError"
                    ></small>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >

                    <small
                        class="form-error"
                        id="passwordError"
                    ></small>

                </div>


                <!-- General message -->

                <div
                    class="auth-message"
                    id="loginMessage"
                ></div>


                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                >
                    Login
                </button>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>

        </section>

    </main>


    <script src="../../js/storage.js"></script>
    <script src="../../js/auth.js"></script>

</body>

</html>
