<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Job | Recruiter Portal</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/navbar-footer.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand-logo"><img src="../assets/logo1.webp" alt="Logo" /></a>
      <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="post-job.html" class="active">Post New Internship</a>
      </nav>
      <div class="nav-auth" id="navAuthContainer"></div>
    </div>
  </header>

  <main class="section-container">
    <div class="panel-card max-width-800">
      <div class="panel-header">
        <h2>Post a New Internship Listing</h2>
        <p>Target qualified university students across departments</p>
      </div>

      <form id="postJobForm" class="auth-form">
        <div class="form-group">
          <label for="jobTitle">Job Title</label>
          <input type="text" id="jobTitle" placeholder="e.g. Frontend Web Developer Intern" required />
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="jobDomain">Domain / Category</label>
            <select id="jobDomain" class="form-control" required>
              <option value="Web Development">Web Development</option>
              <option value="Data Science">Data Science</option>
              <option value="UI/UX Design">UI/UX Design</option>
              <option value="Marketing">Marketing</option>
            </select>
          </div>

          <div class="form-group">
            <label for="jobType">Location Type</label>
            <select id="jobType" class="form-control" required>
              <option value="Remote">Remote</option>
              <option value="On-site">On-site</option>
              <option value="Hybrid">Hybrid</option>
            </select>
          </div>

          <div class="form-group">
            <label for="jobStipend">Monthly Stipend ($)</label>
            <input type="number" id="jobStipend" placeholder="1500" required />
          </div>

          <div class="form-group">
            <label for="jobDeadline">Application Deadline</label>
            <input type="date" id="jobDeadline" required />
          </div>
        </div>

        <div class="form-group">
          <label for="jobDescription">Role Description & Key Requirements</label>
          <textarea id="jobDescription" rows="5" placeholder="Detail responsibilities, tech stack, and qualifications..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Publish Listing</button>
      </form>
    </div>
  </main>
</body>
</html>
