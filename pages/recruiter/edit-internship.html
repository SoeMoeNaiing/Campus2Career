<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Internship | Campus2Career</title>

    <link
        rel="stylesheet"
        href="../../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../../css/responsive.css"
    >
    <link rel="stylesheet" href="../../css/icons.css">
</head>


<body>

    <!-- Header -->
    <header class="dashboard-header">

        <div class="dashboard-nav">

            <a
                href="dashboard.html"
               class="logo"
            >
                 Campus<span>2</span>Career
            </a>


            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a
                    href="internships.html"
                    class="active"
                >
                    My Internships
                </a>

                <a href="applications.html">
                    Applications
                </a>

                <a href="profile.html">
                    Profile
                </a>

                <button
                    type="button"
                    onclick="logout()"
                    class="logout-btn"
                >
                    Logout
                </button>

            </nav>

        </div>

    </header>


    <!-- Main -->
    <main class="profile-container">

        <section class="internships-heading">

            <p class="dashboard-label">
                Recruiter
            </p>

            <h1>
                Edit Internship
            </h1>

            <p>
                Update your internship information.
            </p>

        </section>


        <section class="profile-card">

            <form id="editInternshipForm">

                <div class="profile-form-grid">

                    <div class="form-group">

                        <label for="titleInput">
                            Internship Title
                        </label>

                        <input
                            type="text"
                            id="titleInput"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="companyInput">
                            Company Name
                        </label>

                        <input
                            type="text"
                            id="companyInput"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="locationInput">
                            Location
                        </label>

                        <input
                            type="text"
                            id="locationInput"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="typeInput">
                            Internship Type
                        </label>

                        <select
                            id="typeInput"
                            required
                        >

                            <option value="">
                                Select type
                            </option>

                            <option value="Full-time">
                                Full-time
                            </option>

                            <option value="Part-time">
                                Part-time
                            </option>

                            <option value="Remote">
                                Remote
                            </option>

                            <option value="Hybrid">
                                Hybrid
                            </option>

                        </select>

                    </div>


                                      <!-- Category -->
                    <div class="form-group">

                        <label for="categoryInput">
                            Category
                        </label>

                        <select id="categoryInput" required>

                            <option value="">Select category</option>
                            <option value="Software Development">Software Development</option>
                            <option value="Web Development">Web Development</option>
                            <option value="Mobile Development">Mobile Development</option>
                            <option value="Data">Data</option>
                            <option value="Design">Design</option>
                            <option value="Networking">Networking</option>
                            <option value="IT Support">IT Support</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Finance">Finance</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>


                                            <!-- Duration -->
                    <div class="form-group">

                        <label for="durationInput">
                            Duration
                        </label>

                        <select id="durationInput" required>

                            <option value="">Select duration</option>
                            <option value="1 month">1 month</option>
                            <option value="2 months">2 months</option>
                            <option value="3 months">3 months</option>
                            <option value="4 months">4 months</option>
                            <option value="6 months">6 months</option>
                            <option value="9 months">9 months</option>
                            <option value="12 months">12 months</option>

                        </select>

                    </div>


                    <!-- Compensation -->
                    <div class="form-group">

                        <label for="paidInput">
                            Compensation
                        </label>

                        <select id="paidInput" required>

                            <option value="">Select</option>
                            <option value="paid">Paid</option>
                            <option value="unpaid">Unpaid</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="deadlineInput">
                            Application Deadline
                        </label>

                        <input
                            type="date"
                            id="deadlineInput"
                        >

                        <small>
                            Optional.
                        </small>

                    </div>

                </div>


                <div class="form-group">

                    <label for="skillsInput">
                        Required Skills
                    </label>

                    <input
                        type="text"
                        id="skillsInput"
                    >

                    <small>
                        Separate skills with commas.
                    </small>

                </div>


                <div class="form-group">

                    <label for="descriptionInput">
                        Description
                    </label>

                    <textarea
                        id="descriptionInput"
                        rows="6"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="requirementsInput">
                        Requirements
                    </label>

                    <textarea
                        id="requirementsInput"
                        rows="6"
                        required
                    ></textarea>

                </div>


                <p
                    id="editFormMessage"
                    class="profile-message"
                ></p>


                <div class="profile-form-footer">

                    <a
                        href="internships.html"
                        class="btn btn-outline"
                    >
                        ← Back to My Internships
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script src="../../data/seed.js"></script>
    <script src="../../js/icons.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/cards.js"></script>
    <script src="../../js/footer.js"></script>
    <script src="../../js/recruiter/internships.js"></script>

</body>

</html>
