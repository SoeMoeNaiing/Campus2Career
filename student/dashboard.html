<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal | Campus2Career</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/navbar-footer.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand-logo"><img src="../assets/logo1.webp" alt="Logo" /></a>
      <nav class="nav-links">
        <a href="jobs.html">Browse Jobs</a>
        <a href="dashboard.html" class="active">My Applications</a>
      </nav>
      <div class="nav-auth" id="navAuthContainer"></div>
    </div>
  </header>

  <main class="dashboard-layout section-container">
    <div class="dashboard-header">
      <div>
        <h2 id="welcomeHeader">Student Dashboard</h2>
        <p class="text-muted">Track your active applications and recruitment progress</p>
      </div>
    </div>

    <!-- Application Metrics -->
    <div class="metrics-row">
      <div class="metric-card">
        <span class="metric-num" id="countTotal">0</span>
        <span class="metric-label">Total Applied</span>
      </div>
      <div class="metric-card">
        <span class="metric-num" id="countUnderReview">0</span>
        <span class="metric-label">Under Review</span>
      </div>
      <div class="metric-card">
        <span class="metric-num" id="countShortlisted">0</span>
        <span class="metric-label">Shortlisted / Interview</span>
      </div>
    </div>

    <!-- Kanban Status Columns -->
    <section class="kanban-board">
      <div class="kanban-col">
        <div class="kanban-col-header status-pending">Applied</div>
        <div class="kanban-list" id="colPending"></div>
      </div>
      <div class="kanban-col">
        <div class="kanban-col-header status-review">Under Review</div>
        <div class="kanban-list" id="colReview"></div>
      </div>
      <div class="kanban-col">
        <div class="kanban-col-header status-approved">Interviewing</div>
        <div class="kanban-list" id="colInterview"></div>
      </div>
      <div class="kanban-col">
        <div class="kanban-col-header status-hired">Hired</div>
        <div class="kanban-list" id="colHired"></div>
      </div>
    </section>
  </main>
   <script src="js/core/db.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/navbar.js"></script>
<script src="../js/features/jobs.js"></script>
<script src="../js/features/applications.js"></script>
</body>
</html>
